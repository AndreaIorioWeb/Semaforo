name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Installa Chromium per i test e2e
        run: pnpm --filter @semaforo/scanner exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Test e2e del sito (flusso, accessibilità, privacy, dogfooding)
        run: pnpm --filter @semaforo/web test:e2e
